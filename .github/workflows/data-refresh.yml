name: data-refresh
on:
  schedule:
    - cron: "0 11 * * 1-5"   # weekdays 11:00 UTC (pre-US-open)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refresh fundamentals + quotes + sectors (keyless)
        run: python scripts/update_data.py
      - name: Refresh 12m price history
        run: python scripts/gen_prices.py
      - name: Refresh SEC filing facts
        run: python scripts/sec_ingest.py
      - name: Collect earnings intelligence (beat/miss ledger + consensus + revisions)
        run: python scripts/collect_earnings.py
      - name: Track whales (Berkshire / BlackRock / Citadel — EDGAR + 13F diffs)
        run: python scripts/track_whales.py
      - name: Collect insider transactions (SEC Form 4)
        # Budgeted so a cold cache cannot blow the run; whatever it does not
        # reach today resumes tomorrow. Never blocks the rest of the refresh.
        run: python scripts/collect_insiders.py || echo "insider collection incomplete — keeping previous bundle"
        continue-on-error: true
      - name: Collect management language (transcripts + SEC earnings releases)
        # Narrative Radar input. Never blocks the refresh: a transcript
        # provider outage or plan change must not cost the day's data (the
        # golden-audit incident froze every signal for three days that way).
        # Falls back to SEC 8-K exhibits on its own when FMP is unavailable.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet anthropic || true
          python scripts/collect_language.py || echo "language collection incomplete — keeping previous bundle"
        continue-on-error: true

      - name: Record model track-record snapshot
        run: node scripts/snapshot_scores.js
      - name: Build what-changed signals ledger (deltas + filing diffs)
        run: node scripts/build_signals.js
      - name: Tests must pass before commit
        run: node tests/run_tests.js
      - name: Golden audit must pass before commit
        run: python scripts/golden_audit.py
      - name: Commit refreshed data
        # This list must include every file any step above writes — sectors.js
        # was regenerated fresh every run for 19 days and never committed here,
        # so Direction Edge/Beat Odds ran on a 19-day-stale sector tape with no
        # error or warning anywhere. If you add a new generated file, add it here.
        run: |
          git config user.name "sbc-terminal-bot"
          git config user.email "actions@github.com"
          git add data.js sec.js sectors.js track.js earnings.js signals.js whales.js insiders.js language.js data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "data: automated refresh $(date -u +%F)"
          # Same rebase-and-retry as language-refresh: this job runs for many
          # minutes and a merge landing on main meanwhile must not throw away
          # the day's collected data.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt rejected — refetching and retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
