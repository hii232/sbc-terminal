name: language-refresh
# Narrative Radar corpus on its own schedule. Transcripts and 8-K earnings
# releases land on EARNINGS DATES, not daily, so re-running the whole data
# pipeline to pick them up wastes most of its work. This refreshes only the
# management-language bundle — cheap enough to run through earnings season,
# and dispatchable on any branch to verify collector changes against real
# filings before they reach main.
on:
  schedule:
    - cron: "40 12 * * 2,5"   # Tue + Fri, after the morning data refresh
  workflow_dispatch:
    inputs:
      top:
        description: "How many companies (by market cap) to sweep"
        required: false
        default: "50"
permissions:
  contents: write
jobs:
  language:
    runs-on: ubuntu-latest
    # A full 224-company sweep runs ~2h; the 6h default just wastes a runner
    # if something wedges. Fail at 5h so the cache still gets committed.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Anthropic SDK
        run: pip install --quiet anthropic
      - name: Collect management language
        # ANTHROPIC_API_KEY is what makes the corpus narrative-grade: a model
        # reads each MD&A and names the strategy in it. Without the secret the
        # collector still runs, the corpus is marked not-narrative-grade, and
        # the Narrative Radar stays dark rather than showing junk.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect_language.py --top ${{ github.event.inputs.top || '50' }}
        # A crash partway through must not throw away the work already paid
        # for. The collector caches each company's themes to disk as it goes,
        # but the runner is ephemeral -- without this, a failure at company 180
        # destroys 180 extractions and the next run re-buys every one of them.
        continue-on-error: true
      - name: Tests must pass before commit
        run: node tests/run_tests.js
      - name: Commit language bundle
        # always(): commit the per-company cache even when collection failed,
        # so a partial sweep is progress rather than a total loss. language.js
        # is only rewritten on a clean finish, so a failed run leaves the
        # published bundle untouched and simply banks the cache for next time.
        if: always()
        run: |
          git config user.name "sbc-terminal-bot"
          git config user.email "actions@github.com"
          git add language.js data/language/ || true
          git diff --cached --quiet && exit 0
          git commit -m "data: management-language refresh $(date -u +%F)"
          # A long sweep can take 35+ minutes, and main routinely moves in that
          # window (a merged PR, another data job). A bare push is then rejected
          # and the whole run's work dies with the runner. Rebase onto whatever
          # landed meanwhile and retry: this job only ever adds generated data
          # files, so it never conflicts with source changes.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt rejected — refetching and retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
