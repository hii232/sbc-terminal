name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.45.3
          npx playwright install --with-deps chromium
      - name: Regression tests (production engines)
        run: node tests/run_tests.js
      - name: Form 4 parser fixtures
        run: python tests/test_form4_parse.py
      - name: Canonicalisation fixtures
        run: python tests/test_canonicalise.py
      - name: Estimate-collector fallback fixtures
        run: python tests/test_estimates_fallback.py
      - name: Daily brief composes without error
        run: node scripts/daily_brief.js > /dev/null
      - name: Browser smoke tests
        run: node tests/browser_smoke.js
      - name: Universe + security checks
        run: |
          node scripts/check_universe.js
          ! grep -rE "api_key=|token=[A-Za-z0-9]{20}" --include="*.js" --include="*.html" . || (echo 'possible key leak' && exit 1)
      - name: Golden audit gate
        run: python scripts/golden_audit.py
